version: "3.8"

services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./doc_preview.db
      - CONVERTER_SERVICE_URL=http://converter:8001
      - UPLOAD_DIR=/app/uploads
      - PREVIEW_DIR=/app/previews
    volumes:
      - uploads:/app/uploads
      - previews:/app/previews
      - db_data:/app/doc_preview.db
    depends_on:
      converter:
        condition: service_healthy
    restart: unless-stopped

  converter:
    build:
      context: .
      dockerfile: Dockerfile.converter
    ports:
      - "8001:8001"
    environment:
      - UPLOAD_DIR=/app/uploads
      - PREVIEW_DIR=/app/previews
    volumes:
      - uploads:/app/uploads
      - previews:/app/previews
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - main
    restart: unless-stopped

volumes:
  uploads:
  previews:
  db_data:
